services:
  frontend:
    # Rebuild on every start, so `docker compose up` never runs a stale image.
    pull_policy: build
    build: ./apps/web
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:${AGENT_LENS_PORT:-8080}:80"

  backend:
    # Rebuild on every start, so `docker compose up` never runs a stale image.
    pull_policy: build
    build:
      context: .
      dockerfile: apps/api-lens/Dockerfile
    depends_on:
      executor:
        condition: service_healthy
    environment:
      AGENT_LENS_OTEL_ENABLED: "${AGENT_LENS_OTEL_ENABLED:-0}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      AGENT_LENS_EXECUTOR_SOCKET: "/executor-ipc/executor.sock"
    volumes:
      - type: volume
        source: executor-ipc
        target: /executor-ipc
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: captures
        target: /app/.captures
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=4).close()"
      interval: 5s
      timeout: 3s
      retries: 10

  executor:
    # Rebuild on every start, so `docker compose up` never runs a stale image.
    pull_policy: build
    build:
      context: .
      dockerfile: apps/api-lens/Dockerfile.executor
      args:
        AGENT_LENS_UID: "${AGENT_LENS_UID:-1000}"
        AGENT_LENS_GID: "${AGENT_LENS_GID:-1000}"
    init: true
    environment:
      AGENT_LENS_MODEL: "${AGENT_LENS_MODEL:-gpt-6.2-sol}"
      AGENT_LENS_CLAUDE_MODEL: "${AGENT_LENS_CLAUDE_MODEL:-claude-sonnet-5-5}"
      AGENT_LENS_OTEL_ENABLED: "${AGENT_LENS_OTEL_ENABLED:-0}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    secrets:
      - codex_api_key
    cap_drop:
      - ALL
    # Both agents isolate commands with Bubblewrap, which Docker's default AppArmor and
    # seccomp profiles block. Only this service relaxes them. See the README.
    security_opt:
      - no-new-privileges:true
      - apparmor=unconfined
      - seccomp=unconfined
    volumes:
      - type: bind
        source: ${AGENT_LENS_WORKSPACE:-./workspace}
        target: /workspace
        bind:
          create_host_path: false
      - type: volume
        source: executor-ipc
        target: /executor-data/ipc
      - type: volume
        source: executor-state
        target: /executor-data/state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket; s = socket.socket(socket.AF_UNIX); s.connect('/executor-data/ipc/executor.sock');
          s.sendall(b'GET /ready HTTP/1.0\r\n\r\n'); assert b' 204 ' in s.recv(64)
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    profiles: [observability]
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0
    init: true
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:-}
    ports:
      - "127.0.0.1:${AGENT_LENS_OTLP_PORT:-14318}:4318"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      openobserve:
        condition: service_started

  openobserve:
    profiles: [observability]
    image: public.ecr.aws/zinclabs/openobserve:v1.0.0
    init: true
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:-}
      ZO_LOCAL_MODE: "true"
      ZO_DATA_DIR: /data
    ports:
      - "127.0.0.1:${AGENT_LENS_OPENOBSERVE_PORT:-15080}:5080"
    volumes:
      - observability-data:/data

volumes:
  captures:
  executor-ipc:
  executor-state:
  observability-data:

secrets:
  codex_api_key:
    environment: CODEX_API_KEY
