[project]
name = "api-lens"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.119.1,<1",
    "httpx>=0.28,<1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.11,<3",
    "uvicorn>=0.22,<1",
]

[dependency-groups]
dev = [
    "coverage>=7.17.4",
    "mypy>=2.4.1",
    "pytest>=8,<10",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["C901", "E402", "I", "PLC0415"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.mypy]
python_version = "3.13"
files = ["app.py", "executor.py", "src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["app", "executor", "src"]
