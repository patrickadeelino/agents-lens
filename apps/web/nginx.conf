server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /events {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $event_backend http://backend:8000;
        proxy_pass $event_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
