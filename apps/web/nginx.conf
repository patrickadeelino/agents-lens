# Any other host name is refused, so a web page cannot reach the API through DNS rebinding.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(ready|agents|folders|runs(/[A-Za-z0-9_-]+/(events|stream|continue))?|threads(/by-run/[A-Za-z0-9_-]+|/[A-Fa-f0-9-]+)?)$ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $event_backend http://backend:8000;
        proxy_pass $event_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 135s;
    }

    location ~ ^/(index\.html)?$ {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
