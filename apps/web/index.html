<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Lens</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #10161d;
      color: #e7edf3;
      line-height: 1.5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 860px; margin: 0 auto; padding: 64px 24px; }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 32px;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.05em; line-height: 1.1; }
    header p { color: #a7b4c2; margin-top: 8px; }
    button {
      background: #8aefc7;
      color: #12241d;
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #b3f7dc; }
    button:disabled { opacity: .55; cursor: default; }
    .secondary { background: #24323e; color: #e7edf3; }
    .secondary:hover:not(:disabled) { background: #314352; }
    .run-form { display: grid; gap: 10px; margin-bottom: 24px; }
    .run-form label { font-weight: 650; }
    textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #354654;
      border-radius: 8px;
      background: #161f28;
      color: inherit;
      font: inherit;
    }
    textarea::placeholder { color: #a7b4c2; }
    .run-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    :focus-visible { outline: 2px solid #8aefc7; outline-offset: 4px; }
    section { border: 1px solid #283642; border-radius: 12px; background: #161f28; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      padding: 16px 20px;
    }
    h2 { font-size: 1rem; }
    #status { color: #a7b4c2; font-size: .875rem; }
    #status[data-state="open"], #status[data-state="end"] { color: #8aefc7; }
    #status[data-state="error"] { color: #ffb5a8; }
    ol { list-style: none; margin: 0; padding: 0; }
    li { border-top: 1px solid #283642; }
    summary {
      padding: 12px 20px;
      cursor: pointer;
      font: .875rem/1.5 ui-monospace, monospace;
      overflow-wrap: anywhere;
    }
    summary:hover { background: #1d2934; }
    .agent-message { padding: 0 20px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .offset, .duration { margin-left: 12px; color: #a7b4c2; white-space: nowrap; }
    pre {
      margin: 0;
      padding: 12px 20px 18px;
      background: #10161d;
      color: #c5d3e2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: .875rem;
    }
    @media (max-width: 480px) {
      main { padding: 36px 16px; }
      .section-header, .agent-message, summary, pre { padding-inline: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Agent Lens</h1>
        <p>Workspace de exemplo em somente leitura</p>
      </div>
    </header>

    <form id="run-form" class="run-form">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" name="prompt" rows="4" required
        placeholder="Leia o README e diga o nome do serviço."></textarea>
      <div class="run-actions">
        <button id="execute" type="submit">Executar</button>
        <button id="replay" class="secondary" type="button">Ver replay de exemplo</button>
      </div>
    </form>

    <section aria-labelledby="events-title">
      <div class="section-header">
        <h2 id="events-title">Eventos</h2>
        <p id="status" role="status">Aguardando execução</p>
      </div>
      <ol id="timeline"></ol>
    </section>
  </main>

  <script>
    const form = document.querySelector("#run-form");
    const prompt = document.querySelector("#prompt");
    const execute = document.querySelector("#execute");
    const replay = document.querySelector("#replay");
    const timeline = document.querySelector("#timeline");
    const status = document.querySelector("#status");
    const milliseconds = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 1 });

    function appendRecord(record, commands) {
      const event = record.event;
      const row = document.createElement("li");
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      const label = document.createElement("span");
      const offset = document.createElement("span");
      const payload = document.createElement("pre");

      row.dataset.eventType = event.type;
      label.textContent = event.item?.id ? event.type + " · " + event.item.id : event.type;
      offset.className = "offset";
      offset.title = "Tempo decorrido na captura";
      offset.textContent = "+" + milliseconds.format(record.elapsed_ns / 1_000_000) + " ms";
      payload.textContent = JSON.stringify(event, null, 2);

      summary.append(label, offset);
      if (commands && event.type === "item.completed" && event.item?.type === "command_execution") {
        const durationNs = commands[event.item.id]?.observed_duration_ns;
        const duration = document.createElement("span");
        duration.className = "duration";
        duration.textContent = durationNs == null
          ? "Duração indisponível"
          : milliseconds.format(durationNs / 1_000_000) + " ms de duração observada";
        summary.append(duration);
      }
      details.append(summary, payload);
      if (event.type === "item.completed" && event.item?.type === "agent_message") {
        const message = document.createElement("p");
        message.className = "agent-message";
        message.textContent = event.item.text;
        row.append(message);
      }
      row.append(details);
      timeline.append(row);
    }

    function setStatus(state, message) {
      status.dataset.state = state;
      status.textContent = message;
    }

    function begin(message) {
      execute.disabled = true;
      replay.disabled = true;
      timeline.replaceChildren();
      setStatus("connecting", message);
    }

    function finish(state, message) {
      setStatus(state, message);
      execute.disabled = false;
      replay.disabled = false;
    }

    async function* readFrames(body) {
      const reader = body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = "";

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += value;

          let boundary;
          while ((boundary = /\r?\n\r?\n/.exec(buffer)) !== null) {
            const lines = buffer.slice(0, boundary.index).split(/\r?\n/);
            buffer = buffer.slice(boundary.index + boundary[0].length);
            const name = lines.find((line) => line.startsWith("event:"))?.slice(6).trim();
            const data = lines.filter((line) => line.startsWith("data:"))
              .map((line) => line.slice(5).replace(/^ /, "")).join("\n");
            if (name && data) yield { name, data: JSON.parse(data) };
          }
        }
      } finally {
        try {
          await reader.cancel();
        } catch {
          // Read failures are handled by the caller.
        }
        reader.releaseLock();
      }
    }

    function finishRun(exitCode, turn, error) {
      if (error === "event_too_large") {
        finish("error", "Captura incompleta. Um evento excedeu o limite de 8 MiB.");
      } else if (turn === "turn.failed" || (Number.isInteger(exitCode) && exitCode !== 0)) {
        const code = Number.isInteger(exitCode) ? " (código " + exitCode + ")" : "";
        finish("error", "Execução falhou" + code);
      } else if (exitCode === 0 && turn === "turn.completed") {
        finish("end", "Execução concluída (código 0)");
      } else {
        finish("error", "Resultado da execução não confirmado");
      }
    }

    function saveRunInUrl(runId) {
      const url = new URL(window.location.href);
      if (runId) url.searchParams.set("run_id", runId);
      else url.searchParams.delete("run_id");
      window.history.replaceState(null, "", url);
    }

    function observedTurn(previous, record) {
      const type = record.event.type;
      return ["turn.started", "turn.completed", "turn.failed"].includes(type) ? type : previous;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (execute.disabled) return;
      if (!prompt.value.trim()) {
        setStatus("error", "Digite um prompt para executar.");
        prompt.focus();
        return;
      }

      saveRunInUrl(null);
      begin("Enviando prompt");
      try {
        const response = await fetch("/runs", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "text/event-stream" },
          body: JSON.stringify({ prompt: prompt.value }),
        });
        if (!response.ok || !response.body) {
          finish("error", "Falha ao iniciar a execução (HTTP " + response.status + ")");
          return;
        }

        saveRunInUrl(response.headers.get("X-Run-ID"));
        setStatus("open", "Recebendo eventos");
        let turn;
        for await (const frame of readFrames(response.body)) {
          if (frame.name === "record") {
            appendRecord(frame.data);
            turn = observedTurn(turn, frame.data);
          } else if (frame.name === "end") {
            finishRun(frame.data.exit_code, turn, frame.data.error);
            return;
          }
        }
        finish("error", "Conexão encerrada sem confirmação do resultado");
      } catch {
        finish("error", "Falha na conexão. Resultado da execução não confirmado.");
      }
    });

    replay.addEventListener("click", () => {
      saveRunInUrl(null);
      begin("Conectando ao replay");
      const source = new EventSource("/events");
      function finishReplay(state, message) {
        source.close();
        finish(state, message);
      }

      source.addEventListener("open", () => setStatus("open", "Recebendo eventos do replay"));
      source.addEventListener("record", (message) => appendRecord(JSON.parse(message.data)));
      source.addEventListener("end", () => finishReplay("end", "Replay concluído"));
      source.addEventListener("error", () => finishReplay("error", "Conexão do replay interrompida"));
    });

    async function fetchHistory(runPath) {
      while (true) {
        const response = await fetch(`${runPath}/events`);
        if (response.status !== 409) return response;
        await new Promise((resolve) => setTimeout(resolve, 250));
      }
    }

    function followRun(runPath, page) {
      let turn = page.last_turn;
      const source = new EventSource(`${runPath}/stream?after=${page.latest_event_id ?? 0}`);
      source.addEventListener("open", () => setStatus("open", "Recebendo eventos"));
      source.addEventListener("record", (message) => {
        const record = JSON.parse(message.data);
        appendRecord(record);
        turn = observedTurn(turn, record);
      });
      source.addEventListener("end", (message) => {
        source.close();
        const result = JSON.parse(message.data);
        finishRun(result.exit_code, turn, result.error);
      });
      source.addEventListener("error", () => {
        if (source.readyState === EventSource.CLOSED) finish("error", "Falha ao acompanhar a execução");
        else setStatus("connecting", "Reconectando à execução");
      });
    }

    async function loadHistory(runId) {
      begin("Carregando histórico da execução");
      try {
        const runPath = `/runs/${encodeURIComponent(runId)}`;
        const response = await fetchHistory(runPath);
        if (!response.ok) {
          finish("error", response.status === 404 ? "Execução salva não encontrada" : "Falha ao carregar o histórico");
          return;
        }

        const page = await response.json();
        for (const { record } of page.events) {
          appendRecord(record, page.commands);
        }
        followRun(runPath, page);
      } catch {
        finish("error", "Falha ao carregar o histórico");
      }
    }

    const runId = new URLSearchParams(window.location.search).get("run_id");
    if (runId) loadHistory(runId);
  </script>
</body>
</html>
