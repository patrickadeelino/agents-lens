<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Lens</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #10161d;
      color: #e7edf3;
      line-height: 1.5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 860px; margin: 0 auto; padding: 64px 24px; }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 32px;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -.05em; line-height: 1.1; }
    header p { color: #a7b4c2; margin-top: 8px; }
    button {
      background: #8aefc7;
      color: #12241d;
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #b3f7dc; }
    button:disabled { opacity: .55; cursor: default; }
    :focus-visible { outline: 2px solid #8aefc7; outline-offset: 4px; }
    section { border: 1px solid #283642; border-radius: 12px; background: #161f28; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      padding: 16px 20px;
    }
    h2 { font-size: 1rem; }
    #status { color: #a7b4c2; font-size: .875rem; }
    #status[data-state="open"], #status[data-state="end"] { color: #8aefc7; }
    #status[data-state="error"] { color: #ffb5a8; }
    ol { list-style: none; margin: 0; padding: 0; }
    li { border-top: 1px solid #283642; }
    summary {
      padding: 12px 20px;
      cursor: pointer;
      font: .875rem/1.5 ui-monospace, monospace;
      overflow-wrap: anywhere;
    }
    summary:hover { background: #1d2934; }
    .offset { margin-left: 12px; color: #a7b4c2; white-space: nowrap; }
    pre {
      margin: 0;
      padding: 12px 20px 18px;
      background: #10161d;
      color: #c5d3e2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: .875rem;
    }
    @media (max-width: 480px) {
      main { padding: 36px 16px; }
      .section-header, summary, pre { padding-inline: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Agent Lens</h1>
        <p>Replay da captura de exemplo</p>
      </div>
      <button id="execute" type="button">Executar</button>
    </header>

    <section aria-labelledby="events-title">
      <div class="section-header">
        <h2 id="events-title">Eventos</h2>
        <p id="status" role="status">Aguardando execução</p>
      </div>
      <ol id="timeline"></ol>
    </section>
  </main>

  <script>
    const execute = document.querySelector("#execute");
    const timeline = document.querySelector("#timeline");
    const status = document.querySelector("#status");
    const milliseconds = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 1 });

    function appendRecord(record) {
      const event = record.event;
      const row = document.createElement("li");
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      const label = document.createElement("span");
      const offset = document.createElement("span");
      const payload = document.createElement("pre");

      row.dataset.eventType = event.type;
      label.textContent = event.item?.id ? event.type + " · " + event.item.id : event.type;
      offset.className = "offset";
      offset.title = "Tempo decorrido na captura";
      offset.textContent = "+" + milliseconds.format(record.elapsed_ns / 1_000_000) + " ms";
      payload.textContent = JSON.stringify(event, null, 2);

      summary.append(label, offset);
      details.append(summary, payload);
      row.append(details);
      timeline.append(row);
    }

    execute.addEventListener("click", () => {
      execute.disabled = true;
      timeline.replaceChildren();
      status.dataset.state = "connecting";
      status.textContent = "Conectando";

      const source = new EventSource("/events");

      function finish(state, message) {
        source.close();
        status.dataset.state = state;
        status.textContent = message;
        execute.disabled = false;
      }

      source.addEventListener("open", () => {
        status.dataset.state = "open";
        status.textContent = "Recebendo eventos";
      });
      source.addEventListener("record", (message) => appendRecord(JSON.parse(message.data)));
      source.addEventListener("end", () => finish("end", "Replay concluído"));
      source.addEventListener("error", () => finish("error", "Conexão interrompida"));
    });
  </script>
</body>
</html>
